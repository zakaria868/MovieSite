<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سينما كافيه - أفلام ومسلسلات</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* إعادة تعيين الإعدادات الأساسية واختيار الخط */
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        /* ألوان الهوية البصرية للموقع (Dark Theme) */
        :root {
            --bg-color: #0c111b;
            --card-bg: #192133;
            --primary-color: #ff3d49;
            --text-color: #fff;
            --text-muted: #8f98a9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        /* تعطيل التمرير للخلفية عند فتح النافذة المنبثقة */
        body.modal-open {
            overflow: hidden;
        }

        /* الهيدر وشريط البحث */
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 6%;
            background-color: rgba(12, 17, 27, 0.95);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.3s ease;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .logo h1 span {
            color: var(--primary-color);
        }

        .nav-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-right: 25px;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--primary-color);
        }

        .search-form {
            display: flex;
            align-items: center;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 5px 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .search-form input {
            background: none;
            border: none;
            outline: none;
            color: var(--text-color);
            padding: 5px 10px;
            font-size: 14px;
            width: 200px;
            transition: width 0.3s;
        }

        .search-form button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.3s;
        }

        .search-form button:hover {
            color: var(--primary-color);
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 22px;
            cursor: pointer;
        }

        /* الهيرو سيكشن (البانر الرئيسي) */
        .hero-section {
            position: relative;
            height: 75vh;
            display: flex;
            align-items: center;
            padding: 0 6%;
            margin-top: 75px;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .hero-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(35%);
        }

        .hero-content {
            max-width: 600px;
            z-index: 2;
        }

        .badge {
            background-color: var(--primary-color);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .hero-content h2 {
            font-size: 42px;
            margin: 15px 0;
            font-weight: 700;
            line-height: 1.3;
        }

        .hero-content p {
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 25px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .hero-buttons a {
            padding: 12px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .hero-buttons .btn-play {
            background-color: var(--primary-color);
            color: #fff;
        }

        .hero-buttons .btn-info {
            background-color: rgba(255,255,255,0.2);
            color: #fff;
        }

        .hero-buttons .btn-play:hover { background-color: #e0323d; }
        .hero-buttons .btn-info:hover { background-color: rgba(255,255,255,0.3); }

        /* قسم شبكة الأفلام */
        .container {
            padding: 40px 6%;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-title h2 {
            font-size: 24px;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filters .filter-btn {
            background-color: var(--card-bg);
            border: none;
            color: var(--text-color);
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }

        .filters .filter-btn.active, .filters .filter-btn:hover {
            background-color: var(--primary-color);
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .card-img {
            position: relative;
            height: 300px;
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 15px;
        }

        .rating {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            border-radius: 4px;
            color: #ffc107;
            font-size: 13px;
        }

        .year {
            color: #fff;
            font-size: 13px;
        }

        .card-info {
            padding: 15px;
        }

        .card-info h3 {
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
        }

        .genre {
            color: var(--text-muted);
            font-size: 13px;
        }

        /* ==========================================================================
           أكواد وتنسيقات النافذة المنبثقة الجديدة لتفاصيل وعرض الفيلم (Modal)
           ========================================================================== */
        .movie-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(6, 9, 15, 0.98);
            z-index: 2000;
            display: none; /* مخفي افتراضياً */
            overflow-y: auto;
            padding: 40px 20px;
        }

        .movie-modal.active {
            display: block;
        }

        .modal-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.5);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .modal-close:hover {
            background-color: var(--primary-color);
        }

        /* مشغل الفيديو المدمج (iframe) المتجاوب */
        .video-player-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* نسبة أبعاد الفيديو القياسية 16:9 */
            background-color: #000;
        }

        .video-player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .modal-details {
            padding: 30px;
        }

        .modal-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
            font-size: 14px;
        }

        .modal-meta .modal-rating {
            color: #ffc107;
            font-weight: 600;
        }

        .modal-details h2 {
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .modal-details p {
            color: var(--text-muted);
            line-height: 1.8;
            font-size: 15px;
        }

        /* الفوتر */
        .main-footer {
            text-align: center;
            padding: 30px 20px;
            background-color: #080c14;
            color: var(--text-muted);
            font-size: 14px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        /* ==========================================================================
           تنسيقات التجاوب مع شاشات الموبايل
           ========================================================================== */
        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }

            .nav-container {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: rgba(12, 17, 27, 0.98);
                flex-direction: column;
                padding: 20px;
                gap: 20px;
                box-shadow: 0 10px 15px rgba(0,0,0,0.4);
                display: none;
            }

            .nav-container.open {
                display: flex;
            }

            .nav-links {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 15px;
                width: 100%;
            }

            .nav-links a {
                margin-right: 0;
                font-size: 18px;
            }

            .search-form {
                width: 100%;
            }

            .search-form input {
                width: 100%;
            }

            .hero-section {
                height: 60vh;
                margin-top: 70px;
                padding: 0 4%;
            }

            .hero-content h2 {
                font-size: 26px;
            }

            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
                gap: 15px;
            }

            .card-img {
                height: 220px;
            }

            .modal-details {
                padding: 20px;
            }

            .modal-details h2 {
                font-size: 22px;
            }
        }

        @media (max-width: 480px) {
            .filters {
                width: 100%;
                overflow-x: auto;
                padding-bottom: 5px;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="logo">
            <h1>سينما<span>كافيه</span></h1>
        </div>
        
        <button class="menu-toggle" id="menuToggle">
            <i class="fas fa-bars"></i>
        </button>

        <div class="nav-container" id="navContainer">
            <nav class="nav-links">
                <a href="#" class="active">الرئيسية</a>
                <a href="#">أفلام</a>
                <a href="#">مسلسلات</a>
                <a href="#">المفضلة</a>
            </nav>
            <form class="search-form" id="searchForm">
                <input type="text" id="searchInput" placeholder="ابحث عن فيلمك المفضل...">
                <button type="submit"><i class="fas fa-search"></i></button>
            </form>
        </div>
    </header>

    <section class="hero-section">
        <div class="hero-bg">
            <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80" alt="Featured Movie">
        </div>
        <div class="hero-content">
            <span class="badge">أحدث الإضافات</span>
            <h2 id="featuredTitle">تحميل الأفلام...</h2>
            <p id="featuredDesc">يتم الآن جلب تفاصيل الفيلم المختار في الصدارة من الـ API...</p>
            <div class="hero-buttons">
                <button id="heroPlayBtn" class="btn-play"><i class="fas fa-play"></i> شاهد الآن</button>
                <button id="heroInfoBtn" class="btn-info"><i class="fas fa-info-circle"></i> التفاصيل</button>
            </div>
        </div>
    </section>

    <main class="container">
        <div class="section-title">
            <h2>الأفلام الأكثر شعبية</h2>
            <div class="filters">
                <button class="filter-btn active">الكل</button>
                <button class="filter-btn">أكشن</button>
                <button class="filter-btn">دراما</button>
            </div>
        </div>

        <div class="movies-grid" id="moviesGrid"></div>
    </main>

    <div class="movie-modal" id="movieModal">
        <div class="modal-container">
            <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
            
            <div class="video-player-container">
                <iframe id="modalVideoFrame" src="" allowfullscreen></iframe>
            </div>

            <div class="modal-details">
                <div class="modal-meta">
                    <span class="modal-rating" id="modalRating"></span>
                    <span class="badge" id="modalYear"></span>
                </div>
                <h2 id="modalTitle">اسم الفيلم</h2>
                <p id="modalDesc">تفاصيل وقصة الفيلم...</p>
            </div>
        </div>
    </div>

    <footer class="main-footer">
        <p>جميع الحقوق محفوظة © 2026 | تم التصميم بكل حب لربطه بالـ API</p>
    </footer>

    <script>
        const moviesGrid = document.getElementById('moviesGrid');
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const menuToggle = document.getElementById('menuToggle');
        const navContainer = document.getElementById('navContainer');

        // عناصر المودال المنبثق
        const movieModal = document.getElementById('movieModal');
        const modalClose = document.getElementById('modalClose');
        const modalVideoFrame = document.getElementById('modalVideoFrame');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const modalRating = document.getElementById('modalRating');
        const modalYear = document.getElementById('modalYear');

        let currentFeaturedMovie = null; // لتخزين بيانات فيلم الصدارة الحالي

        // قائمة الموبايل التفاعلية
        menuToggle.addEventListener('click', () => {
            navContainer.classList.toggle('open');
            const icon = menuToggle.querySelector('i');
            icon.className = navContainer.classList.contains('open') ? 'fas fa-times' : 'fas fa-bars';
        });

        // دالة فتح نافذة الفيلم وعرضه بشكل متجاوب بالكامل داخل الصفحة
        function openMovieModal(movie) {
            modalTitle.textContent = movie.title;
            modalDesc.textContent = movie.overview ? movie.overview : "لا يوجد وصف متاح لهذا الفيلم حالياً باللغة العربية.";
            modalRating.innerHTML = `<i class="fas fa-star"></i> ${movie.vote_average ? movie.vote_average.toFixed(1) : '0.0'}`;
            modalYear.textContent = movie.release_date ? movie.release_date.split('-')[0] : 'غير معروف';
            
            // ربط السيرفر وعرض الفيديو داخل الإطار المتجاوب
            modalVideoFrame.src = `https://vidsrc.to/embed/movie/${movie.id}`;
            
            // تفعيل الشاشة وتعطيل التمرير بالخلفية
            movieModal.classList.add('active');
            document.body.classList.add('modal-open');
        }

        // دالة إغلاق المودال وإيقاف الفيديو فوراً لمنع استمرار الصوت بالخلفية
        function closeMovieModal() {
            movieModal.classList.remove('active');
            document.body.classList.remove('modal-open');
            modalVideoFrame.src = ""; // تفريغ الرابط يوقف تشغيل السيرفر تلقائياً
        }

        modalClose.addEventListener('click', closeMovieModal);
        
        // إغلاق المودال عند الضغط في أي مساحة فارغة خارج الحاوية
        movieModal.addEventListener('click', (e) => {
            if(e.target === movieModal) closeMovieModal();
        });

        const TMDB_KEY = "5e41b18533429b5d1433f09a652c525c";
        const POPULAR_MOVIES_URL = `https://api.themoviedb.org/3/movie/popular?api_key=${TMDB_KEY}&language=ar-SA&page=1`;
        const SEARCH_MOVIES_URL = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&language=ar-SA&query=`;
        const IMAGE_BASE_URL = "https://image.tmdb.org/t/p/w500";

        async function getMovies(apiUrl) {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    displayMovies(data.results);
                    currentFeaturedMovie = data.results[0]; // حفظ فيلم البانر
                    updateHeroSection(currentFeaturedMovie);
                } else {
                    moviesGrid.innerHTML = '<p class="no-results" style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px 0;">لم نجد أي أفلام تطابق بحثك.</p>';
                }
            } catch (error) {
                console.error("حدث خطأ أثناء الاتصال بالـ API:", error);
            }
        }

        function displayMovies(movies) {
            moviesGrid.innerHTML = ''; 
            
            movies.forEach(movie => {
                const posterPath = movie.poster_path ? IMAGE_BASE_URL + movie.poster_path : 'https://via.placeholder.com/500x750?text=No+Image';
                const rating = movie.vote_average ? movie.vote_average.toFixed(1) : '0.0';
                const releaseYear = movie.release_date ? movie.release_date.split('-')[0] : 'غير معروف';

                const movieCard = document.createElement('div');
                movieCard.classList.add('movie-card');
                
                // تشغيل النافذة المنبثقة التفاعلية بمجرد الضغط على الكارت
                movieCard.addEventListener('click', () => {
                    openMovieModal(movie);
                });
                
                movieCard.innerHTML = `
                    <div class="card-img">
                        <img src="${posterPath}" alt="${movie.title}" loading="lazy">
                        <div class="card-overlay">
                            <span class="rating"><i class="fas fa-star"></i> ${rating}</span>
                            <span class="year">${releaseYear}</span>
                        </div>
                    </div>
                    <div class="card-info">
                        <h3>${movie.title}</h3>
                        <span class="genre">تقييم الجمهور</span>
                    </div>
                `;
                
                moviesGrid.appendChild(movieCard);
            });
        }

        function updateHeroSection(movie) {
            const heroTitle = document.getElementById('featuredTitle');
            const heroDesc = document.getElementById('featuredDesc');
            const heroBgImg = document.querySelector('.hero-bg img');

            if(movie) {
                heroTitle.textContent = movie.title;
                heroDesc.textContent = movie.overview ? movie.overview : "لا يوجد وصف متاح لهذا الفيلم حالياً باللغة العربية.";
                if(movie.backdrop_path) {
                    heroBgImg.src = `https://image.tmdb.org/t/p/original${movie.backdrop_path}`;
                }
            }
        }

        // تفعيل أزرار البانر الرئيسي لفتح النافذة المدمجة مباشرة
        document.getElementById('heroPlayBtn').addEventListener('click', () => {
            if(currentFeaturedMovie) openMovieModal(currentFeaturedMovie);
        });
        document.getElementById('heroInfoBtn').addEventListener('click', () => {
            if(currentFeaturedMovie) openMovieModal(currentFeaturedMovie);
        });

        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const searchTerm = searchInput.value.trim();
            if(searchTerm && searchTerm !== '') {
                document.querySelector('.section-title h2').textContent = `نتائج البحث عن: ${searchTerm}`;
                getMovies(SEARCH_MOVIES_URL + encodeURIComponent(searchTerm));
            } else {
                document.querySelector('.section-title h2').textContent = "الأفلام الأكثر شعبية";
                getMovies(POPULAR_MOVIES_URL);
            }
        });

        getMovies(POPULAR_MOVIES_URL);
    </script>
</body>
</html>
